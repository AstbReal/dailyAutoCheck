name: daily-master

on:
  workflow_dispatch:
  # Triggers the workflow on push or pull request events but only for the main branch
  # push:
  #   branches: [master]
  #pull_request:
  #   branches: [ main ]

  schedule:
    - cron: 0 2 * * *

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
      - run: pip install -r ./requirements.txt

      # 把所有 Secret 注入到后续步骤的环境变量里（脚本按 GLADOS_USER_*/NOTICES 前缀自动扫描）
      - name: Inject secrets into environment
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          python <<'PY'
          import json, os
          delim = "GH_" + os.urandom(8).hex()
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              for k, v in json.loads(os.environ["SECRETS_JSON"]).items():
                  f.write(f"{k}<<{delim}\n{v}\n{delim}\n")
          PY

      - name: Run checkin
        run: python -m codes.glados.main

  keepalive-job:
    name: Keepalive Workflow
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1